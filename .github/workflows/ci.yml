name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from package.json packageManager

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build

      - name: Typecheck (includes the Astro renderer contract pin)
        run: pnpm exec tsc --noEmit

      - name: Unit, property & fuzz tests
        run: pnpm test

      - name: Docs site build (real Astro integration consumer)
        run: pnpm --filter elements-kit-docs build
