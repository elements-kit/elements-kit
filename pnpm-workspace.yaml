packages:
  - "."
  - "docs"
  - "script"
  - "example"
  - "storybook"
allowBuilds:
  '@swc/core': true
  es5-ext: false
  esbuild: true
  sharp: true
  workerd: true
# One CodeMirror core across the playground's editor packages: duplicate
# instances break CodeMirror's extension identity checks.
overrides:
  "@codemirror/state": ^6.7.6
  "@codemirror/view": ^6.43.13
  "@codemirror/language": ^6.12.4
